spring.application.name=minitask-pacto-mais
server.port=8080
# Banco (mesmos dados do compose.yaml)
spring.datasource.url=jdbc:postgresql://localhost:5434/minitask
spring.datasource.username=postgres
spring.datasource.password=postgres
# JPA: cria/atualiza tabelas automaticamente (bom no início do desafio)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
# Docker Compose: sobe o Postgres ao iniciar a app
spring.docker.compose.lifecycle-management=start-and-stop