spring.application.name=minitask-pacto-mais
server.port=8080
# Banco (mesmos dados do compose.yaml)
spring.datasource.url=jdbc:postgresql://localhost:5434/minitask
spring.datasource.username=postgres
spring.datasource.password=postgres
# JPA: cria/atualiza tabelas automaticamente (bom no início do desafio)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
# Docker Compose: sobe o Postgres ao iniciar a app
spring.docker.compose.lifecycle-management=start-and-stop

app.jwt.secret=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWUsImlhdCI6MTUxNjIzOTAyMn0.KMUFsIDTnFmyG3nMiGM6H9FNFUROf3wh7SmqJp-QV30
app.jwt.expiration-ms=86400000
app.jwt.issuer=minitask-pacto-mais

app.otp.brevo.api-key=${APP_OTP_BREVO_API_KEY:}
app.otp.brevo.sender-email=${APP_OTP_BREVO_SENDER_EMAIL:}
app.otp.brevo.sender-name=${APP_OTP_BREVO_SENDER_NAME:Mini Task}

app.otp.evolution.base-url=${APP_OTP_EVOLUTION_BASE_URL:}
app.otp.evolution.api-key=${APP_OTP_EVOLUTION_API_KEY:}
app.otp.evolution.instance=${APP_OTP_EVOLUTION_INSTANCE:}

app.bot.api-key=${APP_BOT_API_KEY:dev-bot-key}

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000