spring.application.name=minitask-pacto-mais
server.port=${PORT:8080}
server.address=0.0.0.0

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/minitask}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:false}
spring.docker.compose.lifecycle-management=start-and-stop

app.jwt.secret=${APP_JWT_SECRET:change-me-in-env-please-use-a-long-secret}
app.jwt.expiration-ms=86400000
app.jwt.issuer=minitask-pacto-mais

app.otp.brevo.api-key=${APP_OTP_BREVO_API_KEY:}
app.otp.brevo.sender-email=${APP_OTP_BREVO_SENDER_EMAIL:}
app.otp.brevo.sender-name=${APP_OTP_BREVO_SENDER_NAME:Mini Task}

app.otp.evolution.base-url=${APP_OTP_EVOLUTION_BASE_URL:}
app.otp.evolution.api-key=${APP_OTP_EVOLUTION_API_KEY:}
app.otp.evolution.instance=${APP_OTP_EVOLUTION_INSTANCE:}

app.bot.api-key=${APP_BOT_API_KEY:dev-bot-key}

app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}

app.n8n.webhook-url=${APP_N8N_WEBHOOK_URL:}
app.n8n.base-url=${APP_N8N_BASE_URL:}
